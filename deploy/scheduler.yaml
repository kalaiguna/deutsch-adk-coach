# Google Cloud Scheduler Cron Trigger Configurations
# Run these gcloud commands to register the automated morning practice reminders:

# 1. Tuesday & Thursday Daily Conversation (09:00 AM)
# gcloud scheduler jobs create http deutsch-daily-practice \
#     --schedule="0 9 * * 2,4" \
#     --time-zone="Europe/Berlin" \
#     --uri="https://YOUR_CLOUD_RUN_URL/trigger/daily" \
#     --http-method=POST

# 2. Friday Weekend Review Quiz (09:00 AM)
# gcloud scheduler jobs create http deutsch-friday-quiz \
#     --schedule="0 9 * * 5" \
#     --time-zone="Europe/Berlin" \
#     --uri="https://YOUR_CLOUD_RUN_URL/trigger/quiz" \
#     --http-method=POST

# 3. Sunday Listening & Translation (09:00 AM)
# gcloud scheduler jobs create http deutsch-sunday-listening \
#     --schedule="0 9 * * 0" \
#     --time-zone="Europe/Berlin" \
#     --uri="https://YOUR_CLOUD_RUN_URL/trigger/listening" \
#     --http-method=POST
